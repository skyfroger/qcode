  module: turtle
  level: 0
- name: setpos
  description: Перемещает черепаху в точку с абсолютными координатами (x, y). Направление движения не меняется (синонимы — goto() и setposition()).
  class_name: ''
  parameters:
  - name: x
    type_hint: int | float | tuple
    required: true
    description: Координата x либо пара координат (x, y), если y не указан
  - name: y
    type_hint: int | float | None
    required: false
    default_value: None
    description: Координата y
  returns:
    type: None
    description: Не возвращает значения
  examples:
  - code: "# Перемещение в точку (60, 30)\nimport turtle\nturtle.setpos(60, 30)\nprint(turtle.position())"
    output: (60.00,30.00)
  - code: "# Координаты в виде пары\nimport turtle\nturtle.setpos((20, 80))\nprint(turtle.position())"
    output: (20.00,80.00)
  - code: "# Линия из начала координат в точку (100, 100)\nimport turtle\nturtle.setpos(100, 100)"
    output: ''
  sideeffects: Перемещает черепаху и рисует линию, если перо опущено
  url: https://docs.python.org/3/library/turtle.html#turtle.setpos
  module: turtle
  level: 0
- name: setheading
  description: Задаёт направление движения черепахи (абсолютный угол). В стандартном режиме 0 — восток, 90 — север, 180 — запад, 270 — юг (короткое имя — seth()).
  class_name: ''
  parameters:
  - name: to_angle
    type_hint: int | float
    required: true
    description: Угол направления (по умолчанию в градусах)
  returns:
    type: None
    description: Не возвращает значения
  examples:
  - code: "# Направление на север\nimport turtle\nturtle.setheading(90)\nprint(turtle.heading())"
    output: '90.0'
  - code: "# Движение на запад: координата x уменьшается\nimport turtle\nturtle.setheading(180)\nturtle.forward(50)\nprint(turtle.xcor())"
    output: '-50.0'
  - code: "# Движение на север\nimport turtle\nturtle.setheading(90)\nturtle.forward(100)\nprint(turtle.position())"
    output: (0.00,100.00)
  sideeffects: Изменяет направление движения черепахи
  url: https://docs.python.org/3/library/turtle.html#turtle.setheading
  module: turtle
  level: 0
- name: setup
  description: Задаёт размер и положение главного окна черепахи.
