- name: write
  description: Выводит значение (текст, число или результат выражения) в графическое окно в текущей позиции черепахи.
  class_name: ''
  parameters:
  - name: arg
    type_hint: любой тип
    required: true
    description: 'Выводимое значение: текст, число или выражение'
  - name: move
    type_hint: bool
    required: false
    default_value: 'False'
    description: Если True, перо перемещается в правый нижний угол выведенного текста
  - name: align
    type_hint: str
    required: false
    default_value: '''left'''
    description: 'Выравнивание относительно позиции черепахи: ''left'', ''center'' или ''right'''
  - name: font
    type_hint: tuple
    required: false
    default_value: ('Arial', 8, 'normal')
    description: 'Шрифт: тройка (имя шрифта, размер, начертание), например (''Arial'', 8, ''normal'')'
  returns:
    type: None
    description: Не возвращает значения
  examples:
  - code: "# Вывод текста в текущей позиции\nimport turtle\nturtle.write('Привет, мир!')"
    output: ''
  - code: "# Текст с заданным шрифтом\nimport turtle\nturtle.write('Привет, мир!', font=('Arial', 20, 'bold'))"
    output: ''
  - code: "# Значение арифметического выражения\nimport turtle\nturtle.write(2 + 2 * 2)"
    output: ''
  - code: "# Выравнивание по центру\nimport turtle\nturtle.write('Центр', align='center')"
    output: ''
  sideeffects: Выводит текст в графическое окно черепахи
  url: https://docs.python.org/3/library/turtle.html#turtle.write
  module: turtle
  level: 0
- name: done
  description: Оставляет окно черепахи открытым после завершения рисования. Должна быть последней командой программы (синоним — mainloop()).
  class_name: ''
  parameters: []
  returns:
    type: None
    description: Не возвращает значения
  examples:
  - code: "# Окно остаётся открытым после рисования\nimport turtle\nturtle.forward(100)\nturtle.done()"
    output: ''
  - code: "# Использование при импорте через from turtle import *\nfrom turtle import *\ncircle(50)\ndone()"
    output: ''
  sideeffects: Программа ждёт, пока окно черепахи не будет закрыто
  url: https://docs.python.org/3/library/turtle.html#turtle.done
  module: turtle
  level: 0
- name: colormode
  description: Задаёт, как записываются цвета числами (1.0 или 255), или возвращает текущий режим. Значения r, g, b должны лежать в диапазоне от 0 до заданного режима.
  class_name: ''
  parameters:
  - name: cmode
    type_hint: int | float | None
    required: false
    default_value: None
    description: 'Новый режим: 1.0 или 255'
  returns:
    type: int | float | None
    description: Текущий режим, если аргумент не указан; иначе None
  examples:
  - code: "# Режим по умолчанию\nimport turtle\nprint(turtle.colormode())"
    output: '1.0'
  - code: "# Переключение на значения от 0 до 255\nimport turtle\nturtle.colormode(255)\nprint(turtle.colormode())"
    output: '255'
  - code: "# Цвет тремя составляющими RGB\nimport turtle\nturtle.colormode(255)\nturtle.color(240, 160, 80)\nprint(turtle.color())"
    output: ((240.0, 160.0, 80.0), (240.0, 160.0, 80.0))
  sideeffects: Изменяет допустимый диапазон значений r, g, b для всех цветов
  url: https://docs.python.org/3/library/turtle.html#turtle.colormode
  module: turtle
  level: 0