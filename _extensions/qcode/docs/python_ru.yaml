  - code: "# Окно 200 на 200 пикселей в левом верхнем углу экрана\nimport turtle\nturtle.setup(width=200, height=200, startx=0, starty=0)"
    output: ''
  - code: "# Окно в 75% ширины и 50% высоты экрана, по центру\nimport turtle\nturtle.setup(width=0.75, height=0.5, startx=None, starty=None)"
