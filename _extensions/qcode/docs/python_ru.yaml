- name: replace
  category: S
  description: Возвращает копию строки с заменой подстрок.
  class_name: str
  parameters:
  - name: old
    type_hint: str
    required: true
    description: Подстрока для замены
  - name: new
    type_hint: str
    required: true
    description: Новая подстрока
  - name: count
    type_hint: int
    required: false
    default_value: '-1'
    description: Максимальное число замен
  returns:
    type: str
    description: Строка с заменами
  examples:
  - code: "# Замена подстроки\n'hello world'.replace('world', 'Python')"
    output: '''hello Python'''
  - code: "# Только первые две замены\n'aaa'.replace('a', 'b', 2)"
    output: '''bba'''
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#str.replace
- name: find
  category: S
  description: Возвращает индекс первого вхождения подстроки или -1.
  class_name: str
  parameters:
  - name: sub
    type_hint: str
    required: true
    description: Искомая подстрока
  - name: start
    type_hint: int
    required: false
    description: Начало поиска
  - name: end
    type_hint: int
    required: false
    description: Конец поиска
  returns:
    type: int
    description: Индекс вхождения или -1
  examples:
  - code: "# Индекс первого вхождения\n'hello'.find('ll')"
    output: '2'
  - code: "# Подстрока не найдена\n\"hello\".find(\"x\")"
    output: '-1'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#str.find
- name: startswith
  category: S
  description: Проверяет, начинается ли строка с указанной подстроки.
  class_name: str
  parameters:
  - name: prefix
    type_hint: str | tuple[str]
    required: true
    description: Префикс или кортеж префиксов
  - name: start
    type_hint: int
    required: false
    description: Начало проверки
  - name: end
    type_hint: int
    required: false
    description: Конец проверки
  returns:
    type: bool
    description: Результат проверки
  examples:
  - code: "# Проверка начала строки\n'hello'.startswith('he')"
    output: 'True'
  - code: "# Один из префиксов\n'photo.png'.startswith(('photo', 'image'))"
    output: 'True'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#str.startswith
- name: count
  category: C
  description: Возвращает количество вхождений подстроки/значения.
  class_name: str
  parameters:
  - name: sub
    type_hint: str
    required: true
    description: Искомая подстрока или значение
  - name: start
    type_hint: int
    required: false
    description: Начало поиска
  - name: end
    type_hint: int
    required: false
    description: Конец поиска
  returns:
    type: int
    description: Количество вхождений
  examples:
  - code: "# Число вхождений в строке\n'hello'.count('l')"
    output: '2'
  - code: "# Число вхождений в списке\n[1, 2, 2, 3].count(2)"
    output: '2'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#str.count
- name: append
  category: A
  description: Добавляет объект в конец списка.
  class_name: list
  parameters:
  - name: object
    type_hint: object
    required: true
    positional_only: true
    description: Элемент для добавления
  returns:
    type: None
    description: Модифицирует список на месте
  examples:
  - code: "# Добавление в конец списка\nlst = [1, 2]\nlst.append(3)\nlst"
    output: '[1, 2, 3]'
  sideeffects: 'Изменяет исходный список: добавляет элемент в его конец'
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#list.append
- name: pop
  category: P
  description: Удаляет и возвращает элемент по индексу (список) или ключу (словарь).
  class_name: list
  parameters:
  - name: index
    type_hint: int
    required: false
    default_value: '-1'
    positional_only: true
    description: Индекс элемента (по умолчанию последний)
  returns:
    type: object
    description: Удалённый элемент
  examples:
  - code: "# Удаление и возврат последнего элемента\nlst = [1, 2, 3]\nlst.pop()"
    output: '3'
  - code: "# Удаление по индексу\nlst = [1, 2, 3]\nlst.pop(0)\nlst"
    output: '[2, 3]'
  sideeffects: 'Изменяет исходный список: удаляет из него элемент'
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#list.pop
- name: insert
  category: I
  description: Вставляет объект перед указанным индексом.
  class_name: list
  parameters:
  - name: index
    type_hint: int
    required: true
    positional_only: true
    description: Индекс для вставки
  - name: object
    type_hint: object
    required: true
    positional_only: true
    description: Элемент для вставки
  returns:
    type: None
    description: Модифицирует список на месте
  examples:
  - code: "# Вставка перед индексом\nlst = [1, 3]\nlst.insert(1, 2)\nlst"
    output: '[1, 2, 3]'
  sideeffects: 'Изменяет исходный список: вставляет элемент'
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#list.insert
- name: remove
  category: R
  description: Удаляет первое вхождение значения (список) или элемент (множество).
  class_name: list
  parameters:
  - name: value
    type_hint: object
    required: true
    positional_only: true
    description: Значение для удаления
  returns:
    type: None
    description: Модифицирует коллекцию на месте
  examples:
  - code: "# Удаляется первое вхождение\nlst = [1, 2, 2, 3]\nlst.remove(2)\nlst"
    output: '[1, 2, 3]'
  sideeffects: 'Изменяет исходный список: удаляет первое вхождение значения'
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#list.remove
- name: clear
  category: C
  description: Удаляет все элементы из коллекции.
  class_name: list
  parameters: []
  returns:
    type: None
    description: Модифицирует коллекцию на месте
  examples:
  - code: "# Удаление всех элементов\nlst = [1, 2, 3]\nlst.clear()\nlst"
    output: '[]'
  sideeffects: 'Изменяет исходную коллекцию: удаляет все её элементы'
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#list.clear
- name: index
  category: I
  description: Возвращает индекс первого вхождения значения.
  class_name: list
  parameters:
  - name: value
    type_hint: object
    required: true
    description: Искомое значение
  - name: start
    type_hint: int
    required: false
    description: Начало поиска
  - name: end
    type_hint: int
    required: false
    description: Конец поиска
  returns:
    type: int
    description: Индекс вхождения
  examples:
  - code: "# Индекс первого вхождения\n[1, 2, 3].index(2)"
    output: '1'
  - code: "# Поиск с заданной позиции\n[1, 2, 2].index(2, 2)"
    output: '2'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#list.index
- name: get
  category: G
  description: Возвращает значение по ключу или default, если ключ не найден.
  class_name: dict
  parameters:
  - name: key
    type_hint: Hashable
    required: true
    description: Ключ для поиска
  - name: default
    type_hint: object
    required: false
    default_value: None
    description: Значение по умолчанию
  returns:
    type: object
    description: Значение или default
  examples:
  - code: "# Значение по ключу\nd = {'a': 1}\nd.get('a')"
    output: '1'
  - code: "# Значение по умолчанию при отсутствии ключа\nd = {'a': 1}\nd.get('b', 0)"
    output: '0'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#dict.get
- name: update
  category: U
  description: Обновляет словарь элементами из другого словаря или последовательности объектов пар.
  class_name: dict
  parameters:
  - name: other
    type_hint: Mapping | Последовательность объектов (Iterable[tuple])
    required: false
    description: Словарь или последовательность объектов для обновления
  returns:
    type: None
    description: Модифицирует словарь на месте
  examples:
  - code: "# Добавление пары из словаря\nd = {'a': 1}\nd.update({'b': 2})\nd"
    output: '{''a'': 1, ''b'': 2}'
  - code: "# Обновление списком пар\nd = {'a': 1}\nd.update([('b', 2)])\nd"
    output: '{''a'': 1, ''b'': 2}'
  sideeffects: 'Изменяет исходный словарь: добавляет или перезаписывает пары ключ-значение'
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#dict.update
- name: keys
  category: K
  description: Возвращает представление ключей словаря.
  class_name: dict
  parameters: []
  returns:
    type: dict_keys
    description: Представление ключей
  examples:
  - code: "# Список ключей\nlist({'a': 1, 'b': 2}.keys())"
    output: '[''a'', ''b'']'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#dict.keys
- name: values
  category: V
  description: Возвращает представление значений словаря.
  class_name: dict
  parameters: []
  returns:
    type: dict_values
    description: Представление значений
  examples:
  - code: "# Список значений\nlist({'a': 1, 'b': 2}.values())"
    output: '[1, 2]'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#dict.values
- name: items
  category: I
  description: Возвращает представление пар ключ-значение словаря.
  class_name: dict
  parameters: []
  returns:
    type: dict_items
    description: Представление пар ключ-значение
  examples:
  - code: "# Список пар ключ-значение\nlist({'a': 1}.items())"
    output: '[(''a'', 1)]'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#dict.items
- name: add
  category: A
  description: Добавляет элемент во множество.
  class_name: set
  parameters:
  - name: elem
    type_hint: Hashable
    required: true
    description: Элемент для добавления
  returns:
    type: None
    description: Модифицирует множество на месте
  examples:
  - code: "# Добавление элемента во множество\ns = {1, 2}\ns.add(3)\nprint(s)"
    output: '{1, 2, 3}'
  sideeffects: 'Изменяет исходное множество: добавляет элемент'
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#set.add
- name: discard
  category: D
  description: Удаляет элемент из множества, если он присутствует (не вызывает ошибку, если отсутствует).
  class_name: set
  parameters:
  - name: elem
    type_hint: Hashable
    required: true
    description: Элемент для удаления
  returns:
    type: None
    description: Модифицирует множество на месте
  examples:
  - code: "# Удаление элемента\ns = {1, 2, 3}\ns.discard(2)\ns"
    output: '{1, 3}'
  - code: "# Отсутствующий элемент не вызывает ошибку\ns = {1, 2}\ns.discard(99)\ns"
    output: '{1, 2}'
  sideeffects: 'Изменяет исходное множество: удаляет элемент, если он присутствует'
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#set.discard
- name: union
  category: U
  description: Возвращает новое множество с элементами из данного и других множеств.
  class_name: set
  parameters:
  - name: others
    variadic: true
    description: Другие последовательности объектов
  returns:
    type: set
    description: Новое множество
  examples:
  - code: "# Объединение множеств\n{1, 2}.union({2, 3})"
    output: '{1, 2, 3}'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#set.union
- name: intersection
  category: I
  description: Возвращает новое множество с общими элементами.
  class_name: set
  parameters:
  - name: others
    variadic: true
    description: Другие последовательности объектов
  returns:
    type: set
    description: Новое множество
  examples:
  - code: "# Общие элементы множеств\n{1, 2, 3}.intersection({2, 3, 4})"
    output: '{2, 3}'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/stdtypes.html#set.intersection
- name: read
  category: R
  description: Читает до size байт/символов из файла.
  class_name: TextIOWrapper
  parameters:
  - name: size
    type_hint: int
    required: false
    default_value: '-1'
    description: Количество байт/символов для чтения
  returns:
    type: str | bytes
    description: Прочитанные данные
  examples:
  - code: "# Чтение всего файла\nwith open('file.txt') as f:\n    content = f.read()"
    output: ''
  - code: "# Чтение первых 5 символов\nwith open('file.txt') as f:\n    content = f.read(5)"
    output: ''
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/io.html#io.TextIOWrapper.read
- name: write
  category: W
  description: Записывает строку/байты в файл.
  class_name: TextIOWrapper
  parameters:
  - name: s
    type_hint: str | bytes
    required: true
    description: Данные для записи
  returns:
    type: int
    description: Количество записанных символов/байт
  examples:
  - code: "# Запись строки в файл\nwith open('out.txt', 'w') as f:\n    f.write('Hello')"
    output: ''
  sideeffects: Записывает данные в файл
  is_class: false
  url: https://docs.python.org/3/library/io.html#io.TextIOWrapper.write
- name: close
  category: C
  description: Закрывает файл, освобождая ресурсы.
  class_name: TextIOWrapper
  parameters: []
  returns:
    type: None
    description: Не возвращает значения
  examples:
  - code: "# Явное закрытие файла\nf = open('file.txt')\nf.close()"
    output: ''
  sideeffects: Закрывает файл, освобождая системные ресурсы
  is_class: false
  url: https://docs.python.org/3/library/io.html#io.IOBase.close
- name: seek
  category: S
  description: Перемещает указатель файла в новую позицию.
  class_name: TextIOWrapper
  parameters:
  - name: offset
    type_hint: int
    required: true
    description: Смещение в байтах/символах
  - name: whence
    type_hint: int
    required: false
    default_value: '0'
    description: '0: начало, 1: текущая позиция, 2: конец'
  returns:
    type: int
    description: Новая позиция указателя
  examples:
  - code: "# Возврат указателя в начало файла\nf = open('file.txt')\nf.seek(0)\nf.close()"
    output: ''
  sideeffects: Перемещает указатель позиции в файле
  is_class: false
  url: https://docs.python.org/3/library/io.html#io.IOBase.seek
- name: flush
  category: F
  description: Сбрасывает внутренний буфер вывода на диск.
  class_name: TextIOWrapper
  parameters: []
  returns:
    type: None
    description: Не возвращает значения
  examples:
  - code: "# Принудительная запись буфера на диск\nf = open('log.txt', 'w')\nf.write('Hi')\nf.flush()"
    output: ''
  sideeffects: Принудительно записывает содержимое буфера на диск
  is_class: false
  url: https://docs.python.org/3/library/io.html#io.IOBase.flush
- name: group
  category: G
  description: Возвращает одну или несколько подгрупп совпадения.
  class_name: re.Match
  parameters:
  - name: group
    type_hint: int | str
    required: false
    variadic: true
    description: Номер или имя группы
  returns:
    type: str | tuple[str]
    description: Строка совпадения или кортеж
  examples:
  - code: "# Первая группа совпадения\nimport re\nm = re.match(r'(\\w+)', 'hello')\nm.group(1)"
    output: '''hello'''
  - code: "# Вся строка совпадения\nimport re\nm = re.search(r'\\d+', 'abc123')\nm.group(0)"
    output: '''123'''
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/re.html#re.Match.group
- name: start
  category: S
  description: Возвращает начальный индекс совпадения группы.
  class_name: re.Match
  parameters:
  - name: group
    type_hint: int | str
    required: false
    description: Номер или имя группы
  returns:
    type: int
    description: Начальный индекс
  examples:
  - code: "# Начальный индекс совпадения\nimport re\nm = re.search('world', 'hello world')\nm.start()"
    output: '6'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/re.html#re.Match.start
- name: end
  category: E
  description: Возвращает конечный индекс совпадения группы.
  class_name: re.Match
  parameters:
  - name: group
    type_hint: int | str
    required: false
    description: Номер или имя группы
  returns:
    type: int
    description: Конечный индекс
  examples:
  - code: "# Конечный индекс совпадения\nimport re\nm = re.search('world', 'hello world')\nm.end()"
    output: '11'
  sideeffects: ''
  is_class: false
  url: https://docs.python.org/3/library/re.html#re.Match.end
