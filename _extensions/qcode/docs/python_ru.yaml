  - name: height
    type_hint: int | float
    required: false
    default_value: '0.75'
    description: Высота окна. Целое число — размер в пикселях, дробное — доля высоты экрана
  - name: startx
    type_hint: int | None
    required: false
    default_value: None
    description: 'Положение левого края окна: положительное число — от левого края экрана, отрицательное — от правого, None — по центру'
  - name: starty
    type_hint: int | None
    required: false
    default_value: None
    description: 'Положение верхнего края окна: положительное число — от верхнего края экрана, отрицательное — от нижнего, None — по центру'
  returns:
    type: None
    description: Не возвращает значения
  examples:
  - code: "# Окно 450 на 250 пикселей\nimport turtle\nturtle.setup(450, 250)"
